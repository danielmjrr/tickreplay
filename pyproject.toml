[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tickreplay"
version = "0.1.0"
description = "Tick-accurate backtesting for MT5 data: memory-mapped tickstores, a JIT replay kernel, and research tools that guard against overfitting"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "danielmjrr" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "numba>=0.59",
    "pyarrow>=15.0",
    "scipy>=1.11",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Homepage = "https://github.com/danielmjrr/tickreplay"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/tickreplay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
